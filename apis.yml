aid: rollup-ai
name: Rollup AI
description: >-
  Rollup is a browser-based, real-time collaboration platform for engineering
  teams building complex hardware. It supports the full hardware development
  lifecycle across modular tools for systems engineering, systems modeling,
  requirements management, technical documentation, CAD viewing, and design
  reviews, with modules that interlink so changes propagate across a project.
  Rollup markets first-class APIs and developer-friendly features so teams can
  integrate it into new and existing systems; the platform exposes a REST API
  (authenticated with API keys or OAuth tokens) with pagination and websockets.
  Rollup serves early-stage hardware companies from small satellite builders to
  robotics firms, and offers Self-hosted and GovCloud options for ITAR/EAR
  export-controlled data. The company is backed by Andreessen Horowitz (a16z)
  and Thiel Capital ($5.6M seed) and was surfaced in the API Evangelist network
  as an a16z portfolio company.
